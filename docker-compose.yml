services:
  # ============================================
  # DATABASE SERVICES
  # ============================================
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - benchmark-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8081:8081"
    networks:
      - benchmark-network

  arangodb:
    image: arangodb:latest
    container_name: benchmark_arango
    restart: always
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_PASSWORD}
    volumes:
      - arango_data:/var/lib/arangodb3
    networks:
      - benchmark-network

  ravendb:
    image: ravendb/ravendb:latest
    container_name: benchmark_raven
    restart: always
    ports:
      - "8080:8080"
    environment:
      - RAVEN_Security=Unsecured
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
    volumes:
      - raven_data:/opt/RavenDB/Server/RavenData
    networks:
      - benchmark-network

  # ============================================
  # MONITORING SERVICES
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - benchmark-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - benchmark-network

  # Container metrics (CPU, RAM, Network)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - benchmark-network

  # Host system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - benchmark-network

  # MongoDB metrics exporter
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/admin?authSource=admin
    depends_on:
      - mongodb
    networks:
      - benchmark-network

  # ============================================
  # KEY-VALUE DATABASES (Study n°2)
  # ============================================
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Increased heap to 6GB for Goodreads dataset (1.85M docs)
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    environment:
      - JAVA_OPTS=-Xmx6g -Xms1g
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - benchmark-network

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dynamodb-admin
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
    depends_on:
      - dynamodb-local
    networks:
      - benchmark-network

  riak:
    image: basho/riak-kv:latest
    container_name: benchmark_riak
    restart: unless-stopped
    ports:
      - "8087:8087"
      - "8098:8098"
    environment:
      - CLUSTER_NAME=riakts
      - WAIT_FOR_ERLANG=120
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 6G
    volumes:
      - riak_data:/var/lib/riak
    networks:
      - benchmark-network

  # ============================================
  # COLUMN-ORIENTED DATABASES (Study n°3)
  # ============================================
  cassandra:
    image: cassandra:latest
    container_name: benchmark_cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=BenchmarkCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=800M
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool statusgossip) = running ]"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - benchmark-network

  hbase:
    image: harisekhon/hbase:1.3
    container_name: benchmark_hbase
    hostname: hbase-docker
    ports:
      - "16010:16010"
      - "9090:9090"
    environment:
      - HBASE_CONF_hbase_rootdir=file:///hbase_data
      - HBASE_MANAGES_ZK=true
    volumes:
      - hbase_data:/hbase_data
    # command: /opt/hbase/bin/hbase thrift start # harisekhon image starts everything by default usually, or we need to check
    networks:
      - benchmark-network

  # ============================================
  # GRAPH DATABASES (Study n°4)
  # ============================================
  neo4j:
    image: neo4j:5.14.0
    container_name: benchmark_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/benchmark
    volumes:
      - neo4j_data:/data
    networks:
      - benchmark-network

  orientdb:
    image: orientdb:2.2.37
    container_name: benchmark_orientdb
    restart: unless-stopped
    ports:
      - "2424:2424" # Binary
      - "2480:2480" # HTTP
    environment:
      - ORIENTDB_ROOT_PASSWORD=benchmark
    volumes:
      - orientdb_data:/orientdb/databases
    networks:
      - benchmark-network

  janusgraph:
    image: janusgraph/janusgraph:latest
    container_name: benchmark_janusgraph
    restart: unless-stopped
    ports:
      - "8182:8182"
    environment:
      - JANUS_PROPS_TEMPLATE=berkeleyje
    volumes:
      - janusgraph_data:/var/lib/janusgraph
    networks:
      - benchmark-network

volumes:
  mongo_data:
  arango_data:
  raven_data:
  prometheus_data:
  grafana_data:
  dynamodb_data:
  riak_data:
  cassandra_data:
  hbase_data:
  neo4j_data:
  orientdb_data:
  janusgraph_data:

networks:
  benchmark-network:
    driver: bridge
